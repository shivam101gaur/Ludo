<div class="ludo-wrapper">

  <!-- LAYER 1: The 15x15 Static Board -->
  <!-- This renders once and establishes the physical grid geometry -->
  <div class="board-layer">
    @for (cell of boardCells; track cell.id) {
    <div class="board-cell"
         [class.base-cell]="cell.type === 'base'"
         [class.red]="cell.color === 'red'"
         [class.green]="cell.color === 'green'"
         [class.blue]="cell.color === 'blue'"
         [class.yellow]="cell.color === 'yellow'"
         [class.goal-center]="cell.type === 'goal-center'"
         [class.safe-zone]="cell.isSafeZone"
         [style.grid-column]="cell.span ? (cell.x + ' / span ' + cell.span) : cell.x"
         [style.grid-row]="cell.span ? (cell.y + ' / span ' + cell.span) : cell.y">

      <!-- Later, you can load your standalone Home Component inside these -->
      @if (cell.type === 'base') {
      <app-game-home [color]="cell.color || 'grey'" />
      }

      @if(cell.type === 'goal-center') {
      <div class="goal-center">
        <svg style="display: block;"
             xmlns="http://w3.org"
             viewBox="0 0 200 200"
             width="100%"
             height="100%">
          <!-- Outer border/background for the home area -->
          <rect width="200"
                height="200"
                fill="#ffffff"
                stroke="#000000"
                stroke-width="4" />

          <!-- Green Triangle (Top) -->
          <polygon points="0,0 200,0 100,100"
                   fill="#228B22"
                   stroke="#000000"
                   stroke-width="2" />

          <!-- Yellow Triangle (Right) -->
          <polygon points="200,0 200,200 100,100"
                   fill="#FFD700"
                   stroke="#000000"
                   stroke-width="2" />

          <!-- Blue Triangle (Bottom) -->
          <polygon points="200,200 0,200 100,100"
                   fill="#1E90FF"
                   stroke="#000000"
                   stroke-width="2" />

          <!-- Red Triangle (Left) -->
          <polygon points="0,200 0,0 100,100"
                   fill="#DC143C"
                   stroke="#000000"
                   stroke-width="2" />
        </svg>
        <!-- <div class="goal-door red">
        </div>

        <div class="goal-door green">
        </div>

        <div class="goal-door blue">
        </div>

        <div class="goal-door yellow">
        </div> -->
      </div>
      <!-- <app-dice-roll></app-dice-roll> -->

      }
    </div>
    }
  </div>

  <!-- LAYER 2: The High-Performance Tokens -->
  <!-- This layer sits invisibly on top; tokens move within it via GPU -->
  <div class="token-layer">
    @for (token of tokenOnPath_(); track token.id) {
    <!-- <div class="token {{ token.color }}"
             [style.--x]="token.cssX"
             [style.--y]="token.cssY">
        </div> -->

    <app-token [token]="token"></app-token>
    }

  </div>

  <div class="dice-layer">
    <app-dice-roll></app-dice-roll>
    <!-- <app-dice-x></app-dice-x> -->
  </div>
</div>
